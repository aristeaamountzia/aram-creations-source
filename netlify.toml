"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "true"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  # Public client configuration, model names and published contact details.
  # API credentials and FIREBASE_SERVICE_ACCOUNT remain protected.
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_EMAILS,FIREBASE_PROJECT_ID,ORDER_NOTIFICATION_FROM,URL,PUBLIC_SITE_URL,AI_PROVIDER,AI_PROVIDER_ORDER,GEMINI_MODEL,GEMINI_MODEL_ORDER,OPENAI_MODEL,OPENAI_MODEL_ORDER,VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID"
  URL = "https://aramcreationsofficial.netlify.app"
  PUBLIC_SITE_URL = "https://aramcreationsofficial.netlify.app"
  ADMIN_EMAIL = "aristeaamnta@gmail.com"
  ADMIN_EMAILS = "aristeaamnta@gmail.com"
  AI_PROVIDER = "auto"
  AI_PROVIDER_ORDER = "gemini,openai"
  GEMINI_MODEL = "gemini-3.1-flash-lite"
  GEMINI_MODEL_ORDER = "gemini-3.1-flash-lite,gemini-3.5-flash,gemini-3.5-flash-lite,gemini-flash-latest"
  OPENAI_MODEL = "gpt-4o-mini"
  ORDER_NOTIFICATION_FROM = "onboarding@resend.dev"
  FIREBASE_PROJECT_ID = "aramcreations-e1529"
  VITE_FIREBASE_PROJECT_ID = "aramcreations-e1529"
  VITE_FIREBASE_AUTH_DOMAIN = "aramcreations-e1529.firebaseapp.com"
  VITE_FIREBASE_STORAGE_BUCKET = "aramcreations-e1529.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "989899248568"
  VITE_FIREBASE_APP_ID = "1:989899248568:web:9adbb692b7b1a9e363b54d"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/api/artist-profile"
  to = "/.netlify/functions/artist-profile"
  status = 200
  force = true

[[redirects]]
  from = "/api/catalog-backups"
  to = "/.netlify/functions/catalog-backups"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/order-email-test"
  to = "/.netlify/functions/order-email-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

[[redirects]]
  from = "/api/shop-metrics"
  to = "/.netlify/functions/shop-metrics"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-confirm"
  to = "/.netlify/functions/stripe-confirm"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/backoffice-ai"
  to = "/.netlify/functions/backoffice-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/wix-project"
  to = "/.netlify/functions/wix-project"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews/*"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
