[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-dist"

[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"
  URL = "https://aramcreationsofficial.netlify.app"
  PUBLIC_SITE_URL = "https://aramcreationsofficial.netlify.app"
  ADMIN_EMAIL = "aristeaamnta@gmail.com"
  ADMIN_EMAILS = "aristeaamnta@gmail.com"
  AI_PROVIDER = "gemini"
  AI_PROVIDER_ORDER = "gemini,openai"
  GEMINI_MODEL = "gemini-3.5-flash"
  GEMINI_MODEL_ORDER = "gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-latest"
  OPENAI_MODEL = "gpt-4o-mini"
  ORDER_NOTIFICATION_FROM = "onboarding@resend.dev"
  FIREBASE_PROJECT_ID = "aramcreations-e1529"
  VITE_FIREBASE_PROJECT_ID = "aramcreations-e1529"
  VITE_FIREBASE_AUTH_DOMAIN = "aramcreations-e1529.firebaseapp.com"
  VITE_FIREBASE_STORAGE_BUCKET = "aramcreations-e1529.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "989899248568"
  VITE_FIREBASE_APP_ID = "1:989899248568:web:9adbb692b7b1a9e363b54d"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/catalog-backups"
  to = "/.netlify/functions/catalog-backups"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/order-email-test"
  to = "/.netlify/functions/order-email-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-confirm"
  to = "/.netlify/functions/stripe-confirm"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/backoffice-ai"
  to = "/.netlify/functions/backoffice-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/wix-project"
  to = "/.netlify/functions/wix-project"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews/*"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
