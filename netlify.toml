[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-dist"

[build.environment]
  URL = "https://aramcreationsofficial1.netlify.app"
  ADMIN_EMAIL = "aristeaamnta@gmail.com"
  AI_PROVIDER = "gemini"
  GEMINI_MODEL = "gemini-3.5-flash"
  GEMINI_MODEL_ORDER = "gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-flash-latest"
  ORDER_NOTIFICATION_FROM = "onboarding@resend.dev"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/catalog-backups"
  to = "/.netlify/functions/catalog-backups"
  status = 200
  force = true

[[redirects]]
  from = "/api/contact"
  to = "/.netlify/functions/contact"
  status = 200
  force = true

[[redirects]]
  from = "/api/order-email-test"
  to = "/.netlify/functions/order-email-test"
  status = 200
  force = true

[[redirects]]
  from = "/api/media"
  to = "/.netlify/functions/media"
  status = 200
  force = true

[[redirects]]
  from = "/api/orders"
  to = "/.netlify/functions/orders"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-confirm"
  to = "/.netlify/functions/stripe-confirm"
  status = 200
  force = true

[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/backoffice-ai"
  to = "/.netlify/functions/backoffice-ai"
  status = 200
  force = true

[[redirects]]
  from = "/api/wix-project"
  to = "/.netlify/functions/wix-project"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/vinted-reviews/*"
  to = "/.netlify/functions/vinted-reviews"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
