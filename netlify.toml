[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-dist"

[functions]
  node_bundler = "esbuild"

# Stage one is code review/testing only. Do not build or publish this branch.
[context."codex/stage-1-isolation-2026-10-14"]
  ignore = "exit 0"

[[redirects]]
  from = "/api/private-upload"
  to = "/.netlify/functions/private-upload"
  status = 200
  force = true

[[redirects]]
  from = "/api/public-media"
  to = "/.netlify/functions/public-media"
