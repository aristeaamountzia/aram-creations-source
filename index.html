    <!-- Instant Theme Pre-Hydration (Eliminates Flash of Old Theme) -->
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('aram_theme_cache');
          if (raw) {
            var data = JSON.parse(raw);
            if (data && data.designStudio) {
              var bg = data.designStudio.pageBackground || '#fafaf9';
              var ink = data.designStudio.ink || '#18181b';
              document.documentElement.style.backgroundColor = bg;
              document.documentElement.style.color = ink;
            }
          }
        } catch (e) {}
      })();
    </script>
